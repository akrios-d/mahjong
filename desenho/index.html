<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Desenho & Adivinha</title>
<link rel="stylesheet" href="desenho.css">
<link rel="manifest" href="../manifest.json">
<link rel="icon" href="../icons/icon-192.png">
<link rel="apple-touch-icon" href="../icons/icon-192.png">
<meta name="theme-color" content="#0f2027">
<script src="../shared/pwa.js" defer></script>
</head>
<body>
  <header class="topbar">
    <a class="back" href="../index.html" data-i18n="common.back">&larr; voltar</a>
    <h1><span data-i18n="landing.desenho.title">Desenho &amp; Adivinha</span> <span class="tag" data-i18n="landing.badge.online">online</span></h1>
    <div class="lang-bar" id="langBar"></div>
    <div id="phaseLabel" class="phase">--</div>
  </header>

  <div id="lobby" class="lobby">
    <div class="lobby-box">
      <h2 data-i18n="landlord.lobby.title">Entrar em uma sala</h2>
      <label><span data-i18n="common.lobby.roomCode">Código da sala</span>
        <input id="roomCode" type="text" data-i18n-placeholder="desenho.lobby.roomCodePlaceholder" placeholder="ex: DESENHO1" maxlength="12">
      </label>
      <div class="room-search">
        <button id="findRoomsBtn" type="button" data-i18n="common.lobby.findRooms">Buscar salas abertas</button>
        <div id="roomList" class="room-list"></div>
      </div>
      <input id="playerName" type="hidden">
      <button id="connectBtn" data-i18n="desenho.lobby.connect">Entrar</button>
      <p class="hint" data-i18n="desenho.lobby.hint">Até 8 jogadores, só entre pessoas reais (sem bots — desenhar e
        adivinhar não dá pra automatizar aqui). Cada rodada um jogador desenha e
        os outros tentam adivinhar a palavra digitando no chat.</p>
      <p id="lobbyError" class="lobby-error"></p>
    </div>
  </div>

  <div id="roomBar" class="room-bar hidden">
    <div class="seats-bar" id="seatsBar"></div>
    <button id="startBtn" class="start-btn hidden" data-i18n="desenho.start">Começar</button>
  </div>

  <main id="table" class="table hidden">
    <div class="draw-column">
      <div class="round-info">
        <div id="wordHint" class="word-hint">--</div>
        <div id="timerLabel" class="timer">--</div>
      </div>
      <div class="canvas-wrap">
        <canvas id="canvas" width="800" height="600"></canvas>
      </div>
      <div id="toolbar" class="toolbar hidden">
        <div class="colors" id="colors"></div>
        <label><span data-i18n="desenho.thickness">Espessura</span> <input id="sizeRange" type="range" min="2" max="24" value="5"></label>
        <button id="clearBtn" data-i18n="desenho.clear">Limpar</button>
      </div>
    </div>
    <div class="side-column">
      <h3 data-i18n="common.scoreboard">Placar</h3>
      <div id="scoreboard" class="scoreboard"></div>
      <h3 data-i18n="desenho.chat.title">Chat / palpites</h3>
      <div id="chatBox" class="chat-box"></div>
      <form id="guessForm" class="guess-form">
        <input id="guessInput" type="text" data-i18n-placeholder="desenho.chat.placeholder" placeholder="Digite seu palpite..." maxlength="60" autocomplete="off">
        <button type="submit" data-i18n="desenho.chat.send">Enviar</button>
      </form>
      <div id="messageBox" class="message"></div>
    </div>
  </main>

  <script src="../shared/i18n.js"></script>
  <script src="../shared/i18nDict.js"></script>
  <script src="../shared/playerName.js"></script>
  <script src="../shared/serverConfig.js"></script>
  <script src="../shared/roomSearch.js"></script>
  <script src="desenho-client.js"></script>
</body>
</html>
