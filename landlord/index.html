<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Landlord Online</title>
<link rel="stylesheet" href="landlord.css">
<link rel="manifest" href="../manifest.json">
<link rel="icon" href="../icons/icon-192.png">
<link rel="apple-touch-icon" href="../icons/icon-192.png">
<meta name="theme-color" content="#0f2027">
<script src="../shared/pwa.js" defer></script>
</head>
<body>
  <header class="topbar">
    <a class="back" href="../index.html">&larr; voltar</a>
    <h1>Landlord &middot; 斗地主 <span class="tag">online</span></h1>
    <div id="phaseLabel" class="phase">--</div>
  </header>

  <div id="lobby" class="lobby">
    <div class="lobby-box">
      <h2>Entrar em uma sala</h2>
      <label>Endereço do servidor
        <input id="serverUrl" type="text" placeholder="ws://localhost:8787">
      </label>
      <label>Código da sala
        <input id="roomCode" type="text" placeholder="ex: SALA1" maxlength="12">
      </label>
      <label>Seu nome
        <input id="playerName" type="text" placeholder="Seu nome" maxlength="20">
      </label>
      <button id="connectBtn">Entrar online</button>
      <button id="playLocalBtn" class="secondary">Jogar sozinho contra IA (sem servidor)</button>
      <p class="hint">3 assentos por sala. Quem entrar pode clicar em "Começar com IA"
        para preencher as cadeiras vazias com bots e iniciar. O modo "sozinho"
        roda 100% no seu navegador, não precisa do servidor.</p>
      <p id="lobbyError" class="lobby-error"></p>
    </div>
  </div>

  <div id="roomBar" class="room-bar hidden">
    <div class="seats-bar" id="seatsBar"></div>
    <button id="startBtn" class="start-btn hidden">Começar com IA</button>
  </div>

  <main id="table" class="table hidden">
    <div class="opponent left">
      <div class="name" id="nameA">Bot A</div>
      <span class="card-count" id="countA"></span>
      <div class="role" id="roleA"></div>
      <div class="hand-back" id="handA"></div>
      <div class="lastplay" id="lastA"></div>
    </div>
    <div class="opponent right">
      <div class="name" id="nameB">Bot B</div>
      <span class="card-count" id="countB"></span>
      <div class="role" id="roleB"></div>
      <div class="hand-back" id="handB"></div>
      <div class="lastplay" id="lastB"></div>
    </div>

    <div class="center">
      <div class="kitty" id="kitty"></div>
      <div class="lastplay big" id="lastYou"></div>
      <div id="bidBox" class="bid-box hidden">
        <p id="bidPrompt">Sua vez de dar lance</p>
        <div class="bid-buttons">
          <button data-bid="0">Passar</button>
          <button data-bid="1">1</button>
          <button data-bid="2">2</button>
          <button data-bid="3">3</button>
        </div>
      </div>
      <div id="messageBox" class="message"></div>
    </div>

    <div class="you">
      <div class="name">Você <span class="role" id="roleYou"></span></div>
      <div class="hand" id="handYou"></div>
      <div class="controls">
        <button id="playBtn" disabled>Jogar</button>
        <button id="passBtn" disabled>Passar</button>
        <button id="hintBtn">Sugerir</button>
        <button id="newBtn" class="hidden">Nova mão</button>
      </div>
    </div>
  </main>

  <script src="../shared/i18n.js"></script>
  <script src="../shared/i18nDict.js"></script>
  <script src="../shared/landlordRules.js"></script>
  <script src="../shared/roomUtils.js"></script>
  <script src="../shared/landlordEngine.js"></script>
  <script src="landlord-client.js"></script>
</body>
</html>
