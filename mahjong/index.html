<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mahjong Solitaire</title>
<link rel="stylesheet" href="mahjong.css">
</head>
<body>
  <header class="topbar">
    <a class="back" href="../index.html">&larr; voltar</a>
    <h1>Mahjong Solitaire</h1>
    <div class="stats">
      <span>Pares restantes: <b id="pairsLeft">--</b></span>
      <span>Movimentos: <b id="moves">0</b></span>
      <span>Tempo: <b id="timer">00:00</b></span>
    </div>
    <div class="actions">
      <button id="hintBtn">Dica</button>
      <button id="shuffleBtn">Embaralhar restantes</button>
      <button id="newBtn">Novo jogo</button>
    </div>
  </header>

  <main id="board" class="board"></main>

  <div id="winOverlay" class="overlay hidden">
    <div class="overlay-box">
      <h2 id="winTitle">Você limpou o tabuleiro! 🎉</h2>
      <p id="winStats"></p>
      <button id="playAgainBtn">Jogar de novo</button>
    </div>
  </div>

  <script src="mahjong.js"></script>
</body>
</html>
